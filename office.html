<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的替身 · 办公室</title>
<style>

  #toast { top: 128px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; background: rgba(255,255,255,.9); color: #16324a !important;

  #bkRib { background: #f3f3f3; display: flex; gap: 18px; padding: 10px 14px; border-bottom: 1px solid #d4d4d4; }

  .cwrow input, .cwrow select { font: inherit; font-size: 13px; min-width: 0; padding: 5px 6px; border-radius: 8px; border: 1px solid rgba(0,60,120,.25); background: rgba(255,255,255,.9); color: #16324a; }
  .cwrow input[type=color] { padding: 1px; height: 30px; width: 44px; }
  .cwrow button { padding: 4px 6px; }
  #nameIn { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(0,60,120,.25); width: 140px; background: rgba(255,255,255,.85); color: #16324a; }

  #bar { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: 96vw; }
  button { font: inherit; font-size: 14px; color: inherit; cursor: pointer; padding: 8px 13px; border-radius: 12px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.7);
    transition: transform .12s, background .2s; }
  button:hover { transform: translateY(-2px); background: rgba(255,255,255,.85); }
  button.on { background: rgba(120,200,255,.75); }
  body.night button { background: rgba(40,55,110,.55); border-color: rgba(140,170,255,.35); }
  body.night button:hover { background: rgba(70,95,170,.8); }
  body.night button.on { background: rgba(90,130,255,.75); }
  #tip { position: fixed; z-index: 6; pointer-events: none; padding: 4px 10px; border-radius: 8px; font-size: 13px;
    background: rgba(20,30,60,.85); color: #fff; opacity: 0; transition: opacity .15s; transform: translate(14px, 14px); white-space: nowrap; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; color: #16324a; font-size: 16px; text-align: center; padding: 20px; }
</style>

<body>
<div class="bg" id="bgDay"></div>
<div class="bg" id="bgNight"></div>
<canvas id="c"></canvas>

<div class="ui" id="title">
  <h1 id="h1">我的替身</h1>
  <div id="status" class="glass">⌨️ 老老实实上班中</div>
  <div id="hud" class="glass">
    <div class="row"><span>😮‍💨 压力</span><div class="barw"><i id="bStress"></i></div></div>
    <div id="stressTxt"></div>
    <div id="doneTxt"></div>
    <div id="realTxt"></div>
    <div id="payTxt"></div>
  </div>
</div>
<div id="flash"></div>
<div class="ui" id="toast"></div>
<div class="modal" id="prof"><div class="mbox">
  <h2><span id="profTitle">👤 先告诉我你是谁</span><button id="profClose">✕</button></h2>
  <div class="hint2">方块里的人就是你。现实里你不敢做的事，交给他。</div>
  <div class="frow"><label>你的名字</label><input id="pName" maxlength="8" placeholder="比如：小林"></div>
  <div class="frow"><label>你的职位</label><input id="pJob" maxlength="10" placeholder="比如：运营、程序员"></div>
  <div class="frow"><label>老板怎么称呼</label><input id="pBoss" maxlength="6" placeholder="比如：王总"></div>
  <div class="frow"><label>下班时间</label><input id="pOff" type="time"></div>
  <div class="frow"><label>月薪（选填）</label><input id="pPay" type="number" min="0" step="500" placeholder="只存在你自己的浏览器里"></div>
  <div class="frow"><label>穿着</label><div class="opts" id="oOutfit"></div></div>
  <div class="frow"><label>发型</label><div class="opts" id="oHair"></div></div>
  <div class="frow"><label>发色</label><div class="opts" id="oHairC"></div></div>
  <div class="frow"><label>肤色</label><div class="opts" id="oSkin"></div></div>
  <div class="frow"><label>衣服</label><div class="opts" id="oShirt"></div></div>
  <div class="mfoot"><button id="profReset" style="font-size:12px">清空全部记录</button><button id="profOk" class="primary">这就是我</button></div>
</div></div>
<div class="modal" id="cwPanel"><div class="mbox" style="width:min(520px,94vw)">
  <h2><span>👥 我的同事</span><button id="cwClose">✕</button></h2>
  <div class="hint2">照着你现实里的同事来设定：名字、性格、穿着。点办公室里的同事可以让替身去找他。</div>
  <div class="cwhead"><span>名字</span><span>性格</span><span>穿着</span><span>发型</span><span>衣色</span><span></span></div>
  <div id="cwList"></div>
</div></div>
<div id="cwMenu"><div id="cwmTitle"></div>
  <button data-a="roll">🙄 翻白眼</button><button data-a="coffee">☕ 送咖啡</button><button data-a="face">😜 做鬼脸</button><button data-a="chat">💬 找他聊天</button>
  <button data-a="edit" class="sub">✏️ 改同事设定</button></div>
<div class="modal" id="diary"><div class="mbox">
  <h2><span>📓 替身日记</span><button id="diaryClose">✕</button></h2>
  <div class="hint2" id="diaryHead"></div>
  <div id="diaryList"></div>
  <div class="hint2" id="diaryFoot"></div>
</div></div>
<div id="bk">
  <div id="bkTop"><b>▦ Excel</b><span>Q4周报_终版_v3（最终）.xlsx</span></div>
  <div id="bkTabs"><span>文件</span><span class="on">开始</span><span>插入</span><span>页面布局</span><span>公式</span><span>数据</span><span>审阅</span><span>视图</span></div>
  <div id="bkRib"><span>📋 粘贴</span><span><b>B</b> <i>I</i> <u>U</u></span><span>等线 ▾ 11 ▾</span><span>≡ 合并后居中</span><span>条件格式 ▾</span><span>Σ 自动求和</span></div>
  <div id="bkFx"><span>F12</span><span>fx</span><span>=SUM(F3:F11)</span></div>
  <div id="bkGrid"><table id="bkTable"></table></div>
  <div id="bkStatus"><span>就绪</span><span>平均值: 86.4　计数: 9　求和: 777.6　100%</span></div>
</div>
<div class="ui" id="top">
  <button id="btnCw">👥 同事</button>
  <button id="btnCam">🎥 跟随</button>
  <button id="btnDiary">📓 日记</button>
  <button id="btnProf">👤 我</button>
  <button id="btnSound">🔊 声音</button>
  <button id="btnNight">🌙 夜晚</button>
  <button id="btnSpin">🔄</button>
  <button id="btnKey">🙈 Esc</button>
</div>
<div class="ui" id="cmd">
  <div id="cmdRow">
    <input id="cmdIn" maxlength="30" placeholder="想让他替你做什么？比如：怼老板、去海边、睡一觉">
    <button id="cmdGo" class="primary">让他去做</button>
    <button id="cmdWork">💼 回去上班</button>
  </div>
  <div id="cats"></div>
  <div id="cmdBtns"></div>
</div>
<div id="tip"></div>
<div id="err">3D 库加载失败，请检查网络连接后刷新页面。</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script>
  window.addEventListener('error', e => { if (!window.__ok) document.getElementById('err').style.display = 'flex'; }, true);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
window.__ok = true;

/* ---------- 基础 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const CAM_HOME = new THREE.Vector3(5.2, 5.6, 13.2).multiplyScalar(Math.min(1.9, Math.max(1, 1.75 / (innerWidth / innerHeight))));
camera.position.copy(CAM_HOME);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, -0.9, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 40;
controls.autoRotateSpeed = 0.8;

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- 灯光 ---------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x8899bb, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(6, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(3072, 3072);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 6, bottom: -6, near: 1, far: 34 });
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ---------- 小工具 ---------- */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...o });
function add(geo, m, x, y, z, parent) {
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
const box = (w, h, d, m, x, y, z, p) => add(new THREE.BoxGeometry(w, h, d), m, x, y, z, p);
const cyl = (rt, rb, h, m, x, y, z, p, seg = 24) => add(new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, p);

}
function tickParts(dt, t) {
  if (pLife <= 0) { pMat.opacity = 0; return; }
  pLife -= dt; pMat.opacity = Math.min(1, pLife / 1.5);
  const drag = Math.exp(-dt * 1.2);
  for (let i = 0; i < PN; i++) {
    const ix = i * 3, x = pPos[ix], z = pPos[ix + 2];
    const fl = Math.abs(x) < BX - 0.3 && Math.abs(z) < 2.7 ? -2.42 : -2.93;
    if (pPos[ix + 1] <= fl) { pPos[ix + 1] = fl; continue; }
    pVel[ix] = pVel[ix] * drag + Math.sin(t * 2 + i) * 0.4 * dt; pVel[ix + 2] = pVel[ix + 2] * drag + Math.cos(t * 2.3 + i) * 0.4 * dt;
    pVel[ix + 1] = Math.max(-1.2, pVel[ix + 1] - pGrav * dt);
    pPos[ix] = clamp(x + pVel[ix] * dt, -BX + 0.1, BX - 0.1); pPos[ix + 1] = Math.min(2.9, pPos[ix + 1] + pVel[ix + 1] * dt); pPos[ix + 2] = clamp(z + pVel[ix + 2] * dt, -2.9, 2.9);
  }

}

function drawScreen(t) {
  const W = 320, Hh = 192;
  if (screenMode === 2) { sctx.fillStyle = '#05070c'; sctx.fillRect(0, 0, W, Hh); screenTex.needsUpdate = true; return; }
  if (screenMode === 3) {
    const sky = sctx.createLinearGradient(0, 0, 0, Hh); sky.addColorStop(0, '#ff9a8b'); sky.addColorStop(1, '#ffd59e');
    sctx.fillStyle = sky; sctx.fillRect(0, 0, W, Hh);
    sctx.fillStyle = '#fff3c4'; sctx.beginPath(); sctx.arc(240, 70 + Math.sin(t) * 4, 26, 0, 7); sctx.fill();
    sctx.fillStyle = '#7a5cff'; sctx.beginPath(); sctx.moveTo(0, Hh);
    for (let x = 0; x <= W; x += 16) sctx.lineTo(x, 130 + Math.sin(x * 0.03 + t * 0.8) * 16);
    sctx.lineTo(W, Hh); sctx.fill();
    sctx.fillStyle = '#2b3350'; sctx.fillRect(90 + Math.sin(t * 2) * 30, 108, 16, 34); sctx.beginPath(); sctx.arc(98 + Math.sin(t * 2) * 30, 100, 11, 0, 7); sctx.fill();
    sctx.fillStyle = 'rgba(0,0,0,.55)'; sctx.fillRect(0, Hh - 16, W, 16);
    sctx.fillStyle = '#ff4d6d'; sctx.fillRect(8, Hh - 9, ((t * 12) % (W - 16)), 3);
    screenTex.needsUpdate = true; return;
  }
  sctx.fillStyle = '#0f1729'; sctx.fillRect(0, 0, W, Hh);
  sctx.fillStyle = '#1b2742'; sctx.fillRect(0, 0, W, 18);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { sctx.fillStyle = c; sctx.beginPath(); sctx.arc(12 + i * 14, 9, 4, 0, 7); sctx.fill(); });
  if (screenMode === 0) {
    const total = CODE.reduce((s, l) => s + l.length + 1, 0);
    let n = Math.floor(typed) % (total * 3), li = 0; const lines = [];
    while (n >= 0) { const l = CODE[li % CODE.length]; if (n >= l.length + 1) { lines.push(l); n -= l.length + 1; li++; } else { lines.push(l.slice(0, n)); break; } }
    const show = lines.slice(-9);
    sctx.font = '14px Consolas, monospace'; sctx.textBaseline = 'top';
    show.forEach((l, i) => {
      sctx.fillStyle = l.trim().startsWith('//') ? '#6b7c9c' : /function|const|for|if|while|return|export|await/.test(l) ? '#8ec5ff' : '#d6e2ff';
      sctx.fillText(l, 10, 26 + i * 18);
    });
    if (Math.floor(t * 2.5) % 2 === 0) { const last = show[show.length - 1] || ''; sctx.fillStyle = '#7dffb0'; sctx.fillRect(10 + sctx.measureText(last).width + 1, 26 + (show.length - 1) * 18, 7, 14); }
  } else {
    sctx.strokeStyle = '#26365c'; sctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { sctx.beginPath(); sctx.moveTo(14, 40 + i * 32); sctx.lineTo(306, 40 + i * 32); sctx.stroke(); }
    const cols = ['#4dabf7', '#69db7c', '#ffd43b', '#ff8787', '#b197fc', '#38d9a9', '#ffa94d', '#74c0fc'];
    sctx.beginPath();

}

    pose: U({ aE: -0.4, bE: -0.4, tX: 0.07, ...c }),
    start() { walking = true; walkSpd = speed; },

      return false;

  n.bub.tick(dt); n.rig.head.getWorldPosition(tmpV); room.worldToLocal(tmpV);
  n.bub.sp.position.set(tmpV.x, tmpV.y + 0.85, tmpV.z);
  n.label.material.opacity = n.bub.sp.material.opacity > 0.05 ? 0 : 0.9;
  n.label.position.y = n.seated ? 1.42 : 1.62;
}
function tickOffice(dt, t) {
  if (gossipCd > 0) gossipCd -= dt;
  if (bossCheckT > 0) { bossCheckT -= dt; if (bossCheckT <= 0) bossLeave(false); }
  for (const n of npcs) tickNPC(n, dt, t);
}
for (let i = 0; i < CW_SLOTS.length; i++) makeNPC(i);

/* ---- 点同事弹出的菜单 ---- */
let lastPtr = [innerWidth / 2, innerHeight / 2], menuNpc = null;
canvas.addEventListener('pointerdown', e => { lastPtr = [e.clientX, e.clientY]; }, true);
function openCwMenu(i) {
  const n = npcs[i]; menuNpc = n;
  el('cwmTitle').textContent = `${NM(n)} · ${PERSONA[P(n)].n}`;
  const m = el('cwMenu'); m.style.display = 'block';
  const x = Math.min(lastPtr[0] + 10, innerWidth - m.offsetWidth - 8), y = Math.min(lastPtr[1] + 10, innerHeight - m.offsetHeight - 8);
  m.style.left = x + 'px'; m.style.top = y + 'px';
}
el('cwMenu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !menuNpc) return;
  el('cwMenu').style.display = 'none';
  if (b.dataset.a === 'edit') { openCwPanel(); return; }
  cwTarget = menuNpc.i; command('cw_' + b.dataset.a);
});
addEventListener('pointerdown', e => { if (!e.target.closest('#cwMenu')) el('cwMenu').style.display = 'none'; });

/* ---- 同事设定面板 ---- */
function openCwPanel() {
  const hx = n => '#' + n.toString(16).padStart(6, '0');
  const opt = (list, v) => list.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('');
  el('cwList').innerHTML = save.cw.map((o, i) => `<div class="cwrow" data-i="${i}">
    <input data-f="name" maxlength="6" value="${o.name.replace(/"/g, '')}">
    <select data-f="persona">${opt(Object.entries(PERSONA).map(([k, v]) => [k, v.n]), o.persona)}</select>
    <select data-f="outfit">${opt(OUTFITS, o.outfit)}</select>
    <select data-f="hair">${opt(HAIRS, o.hair)}</select>
    <input data-f="shirt" type="color" value="${hx(o.shirt ?? OUTFIT_DEF[o.outfit])}">
    <button data-f="rand" title="随机发色和肤色">🎲</button></div>`).join('');
  el('cwPanel').classList.add('open');
}
el('cwList').addEventListener('input', cwEdit); el('cwList').addEventListener('change', cwEdit);
el('cwList').addEventListener('click', e => { if (e.target.dataset.f === 'rand') cwEdit(e); });
function cwEdit(e) {
  const row = e.target.closest('.cwrow'); if (!row) return;
  const i = +row.dataset.i, o = save.cw[i], f = e.target.dataset.f;
  if (f === 'name') o.name = e.target.value.trim() || CW_DEF[i].name;
  else if (f === 'shirt') o.shirt = parseInt(e.target.value.slice(1), 16);
  else if (f === 'rand') { o.hairCol = Math.floor(rand(0, HAIRC.length)); o.skin = Math.floor(rand(0, SKINC.length)); }
  else if (f) o[f] = e.target.value;
  dressNPC(npcs[i]); persist();
}
el('btnCw').addEventListener('click', openCwPanel);
el('cwClose').addEventListener('click', () => el('cwPanel').classList.remove('open'));
el('cwPanel').addEventListener('pointerdown', e => { if (e.target === el('cwPanel')) el('cwPanel').classList.remove('open'); });

/* ---- 镜头跟随我的替身 ---- */
let follow = false;
const camOff = new THREE.Vector3(), folT = new THREE.Vector3();
el('btnCam').addEventListener('click', () => {
  follow = !follow; el('btnCam').classList.toggle('on', follow);
  if (follow) { man.getWorldPosition(folT); folT.y += 0.8; camOff.copy(camera.position).sub(controls.target).setLength(5.5); camera.position.copy(folT).add(camOff); controls.target.copy(folT); }
  else { controls.target.set(0, -0.9, 0); camera.position.copy(CAM_HOME); }
});
function tickFollow(dt) {
  if (!follow) return;
  man.getWorldPosition(folT); folT.y += man.visible ? 0.8 : 0.4;
  const k = 1 - Math.exp(-dt * 4);
  camOff.subVectors(folT, controls.target).multiplyScalar(k);
  controls.target.add(camOff); camera.position.add(camOff);
}

CMDS.push(
  { id: 'cw_roll', relief: 12, log: () => `对${NM(npcs[cwTarget])}翻了个大白眼` },
  { id: 'cw_coffee', relief: 6, log: () => `给${NM(npcs[cwTarget])}送了杯咖啡` },
  { id: 'cw_face', relief: 8, log: () => `冲${NM(npcs[cwTarget])}做了个鬼脸` },
  { id: 'cw_chat', relief: 5, log: () => `上班时间跑去找${NM(npcs[cwTarget])}聊天` });
Object.assign(scripts, { cw_roll: () => cwScript('roll'), cw_coffee: () => cwScript('coffee'), cw_face: () => cwScript('face'), cw_chat: () => cwScript('chat') });

function tickDecor(dt, t) {
  lightMats.forEach((m, i) => { m.emissiveIntensity = (0.8 + 0.7 * Math.sin(t * 2 + i * 1.6)) * lerp(1, 2.2, nightK); });
  fishDart *= Math.exp(-dt * 1.5); fishPhase += dt * (0.8 + 5 * fishDart);
  fishes.forEach((f, i) => { const a = fishPhase * (i ? -0.8 : 1) + i * 2; f.position.set(Math.cos(a) * 0.13, 0.69 + i * 0.07 + Math.sin(t * 1.3 + i) * 0.03, Math.sin(a) * 0.12); f.rotation.y = (i ? Math.PI : 0) - a; });
  arcClock += dt; if (arcClock > 0.12) { arcClock = 0; drawArcade(t); }
  if (!cat.visible) return;
  catS.happy *= Math.exp(-dt * 2);
  if (catS.u < 1) {
    catS.u = Math.min(1, catS.u + dt / 0.9);
    cat.position.lerpVectors(catS.from, catSpot(catS.spot, tmpV), catS.u); cat.position.y += 4 * 0.7 * catS.u * (1 - catS.u);
  } else {
    catSpot(catS.spot, cat.position); cat.position.y += Math.abs(Math.sin(t * 10)) * 0.1 * catS.happy;
    catS.wait -= dt;
    if (catS.wait <= 0 && !lying) { catS.from.copy(cat.position); catS.spot = (catS.spot + 1 + Math.floor(rand(0, 2))) % 3; catS.u = 0; catS.wait = rand(18, 35); }
  }
  let dr = CAT_ROT[catS.spot] - cat.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); cat.rotation.y += dr * Math.min(1, dt * 5);
  catTail.rotation.set(-0.7, 0, Math.sin(t * (3 + 8 * catS.happy)) * 0.45);
  catHead.rotation.z = Math.sin(t * 0.9) * 0.1;
  const sleepy = Math.sin(t * 0.25 + 1) > 0.55 && catS.happy < 0.1;
  catEyes.forEach(e => { e.scale.y = sleepy ? 0.15 : 1; });
}

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock(), tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
const dayCol = new THREE.Color(0xfff4e0), nightCol = new THREE.Color(0x8fa8ff);
const fC = { smile: 0.6, open: 0, brow: 0, closed: 0 };
let blinkT = rand(2, 4), hudClock = 0, earK = 0;
function frame() {
  if (bossKeyOn) { clock.getDelta(); requestAnimationFrame(frame); return; }
  if (frozen && !simDt) { clock.getDelta(); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); return; }
  const dt = simDt || Math.min(clock.getDelta(), 0.05), t = simDt ? (simT += simDt) : clock.elapsedTime + simT;
  const k8 = 1 - Math.exp(-dt * 8);

  tickBehavior(dt, t);
  for (const k of KEYS) { vel[k] += ((tgt[k] - cur[k]) * 130 - vel[k] * 17) * dt; cur[k] += vel[k] * dt; }
  applyPose();
  chest.scale.y = 1 + Math.sin(t * 1.8) * 0.015;

  if (!walking) { man.position.x += (manPosT.x - man.position.x) * k8; man.position.z += (manPosT.y - man.position.z) * k8; }
  let dr = rotT - man.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
  man.rotation.y += dr * (1 - Math.exp(-dt * 9));
  const k5 = 1 - Math.exp(-dt * 5);
  man.rotation.x += ((lying ? -Math.PI / 2 : 0) - man.rotation.x) * k5;
  manY += ((lying ? BED.lieY : 0) - manY) * k5;
  man.position.y = manY + Math.sin(clamp(manY / BED.lieY, 0, 1) * Math.PI) * 0.22;
  blanketK += ((sleeping ? 1 : 0) - blanketK) * (1 - Math.exp(-dt * 4));
  blanket.scale.set(lerp(0.2, 1, blanketK), lerp(0.55, 1, blanketK), 1);
  chair.position.x += (chairT - chair.position.x) * (1 - Math.exp(-dt * 6));
  if (seated) chair.rotation.y = man.rotation.y + Math.PI / 2; else chair.rotation.y *= Math.exp(-dt * 4);

  // 表情
  const f = (step && step.face) || {};
  const idleNow = idle();
  let tSmile = f.smile ?? (st.mood > 55 ? 0.85 : st.mood > 30 ? 0.45 : 0.6);
  let tOpen = f.open ?? 0, tBrow = f.brow ?? (st.energy < 25 ? -0.5 : 0), tClosed = f.closed ?? 0;
  if (step && step.talk) tOpen = 0.25 + 0.4 * Math.abs(Math.sin(t * 13));
  if (idleNow && hoverMan) { tSmile = 1; tBrow = 0.6; } if (patT > 0) { tSmile = 1; tClosed = 1; tOpen = 0; }
  const kf = 1 - Math.exp(-dt * 12);
  fC.smile += (tSmile - fC.smile) * kf; fC.open += (tOpen - fC.open) * kf; fC.brow += (tBrow - fC.brow) * kf; fC.closed += (tClosed - fC.closed) * kf;
  const sad = st.mood <= 30 && f.smile === undefined && !(idleNow && hoverMan);
  smileMesh.visible = false; smileMesh.rotation.z = sad ? 0 : Math.PI; smileMesh.position.y = MOUTH_Y - (sad ? 0.026 : 0);
  smileMesh.scale.set(0.45 + fC.smile * 0.75, 0.25 + fC.smile * 0.85, 1);
  openMesh.visible = fC.open >= 0.25; openMesh.scale.set(0.7 + fC.open * 0.3, 0.35 + fC.open * 0.8, 0.35);
  blinkT -= dt; if (blinkT < 0) blinkT = rand(2, 5);
  const ey = (blinkT < 0.12 ? 0.1 : 1) * (1 - 0.88 * fC.closed);
  eyes.forEach(e => e.scale.y = ey);
  brows.forEach(b => { b.position.y = b.userData.y0 + fC.brow * 0.022; b.rotation.z = b.userData.s * (fC.brow * -0.3 - 0.06); });

  // 手里拿的东西
  man.updateWorldMatrix(true, true);
  const ry = man.rotation.y, fx = Math.sin(ry), fz = Math.cos(ry);
  mugTilt += (mugTiltT - mugTilt) * k8;
  if (held.mug) {
    room.worldToLocal(handA.getWorldPosition(tmpV));
    mug.position.set(tmpV.x + fx * 0.07, tmpV.y - 0.03, tmpV.z + fz * 0.07); mug.rotation.set(-mugTilt, ry, 0);
    room.worldToLocal(headPt(tmpV2, 0, AV.mouthUp, AV.mouthFwd)); tmpV2.y -= 0.09;
    mug.position.lerp(tmpV2, clamp(mugTilt / 0.6, 0, 1));
  }
  if (held.phone) {
    room.worldToLocal(handB.getWorldPosition(tmpV));
    phone.position.set(tmpV.x, tmpV.y + 0.1, tmpV.z); phone.rotation.set(Math.PI / 2, ry, Math.PI / 2);
    earK += ((step && step.ear ? 1 : 0) - earK) * k8;
    room.worldToLocal(headPt(tmpV2, -AV.earSide, AV.earUp, 0.02)); phone.position.lerp(tmpV2, earK);
  }
  if (held.book) {
    room.worldToLocal(handA.getWorldPosition(tmpV)); room.worldToLocal(handB.getWorldPosition(tmpV2));
    book.position.copy(tmpV).add(tmpV2).multiplyScalar(0.5); book.position.y += 0.03; book.rotation.set(-0.7, ry, 0);
  }
  if (held.paper) { room.worldToLocal(handA.getWorldPosition(tmpV)); paper.position.set(tmpV.x + fx * 0.05, tmpV.y, tmpV.z + fz * 0.05); paper.rotation.x += dt * 5; }
  if (ball.flying) {
    ball.u += dt / 0.95; const u = Math.min(1, ball.u);
    paper.position.lerpVectors(ball.p0, ball.p1, u); paper.position.y += 4 * 0.9 * u * (1 - u); paper.rotation.x += dt * 9; paper.rotation.z += dt * 7;
    if (u >= 1) {
      ball.flying = false; paper.visible = false;
      if (!ball.hit) {
        const l = add(paperGeo, paperM, ball.p1.x, 0.05, ball.p1.z, room); l.rotation.set(rand(0, 3), rand(0, 3), 0); litter.push(l);
        if (litter.length > 6) room.remove(litter.shift());
      } else sfx.click();
    }
  }
  if (ringing) {
    phone.rotation.y = Math.sin(t * 55) * 0.18; phone.position.y = PHONE_HOME.y + Math.abs(Math.sin(t * 40)) * 0.012;
    ringClock -= dt; if (ringClock <= 0) { sfx.ring(); ringClock = 0.55; }
  }
  phoneFace.material.emissiveIntensity = (ringing && Math.floor(t * 6) % 2) || held.phone ? 1.6 : 0;

  tickBot(dt); tickDecor(dt, t); tickGame(dt, t); tickOffice(dt, t); tickFollow(dt);
  plantW *= Math.exp(-dt * 1.6); leaves.rotation.z = Math.sin(t * 14) * 0.22 * plantW; leaves.rotation.x = Math.cos(t * 11) * 0.12 * plantW;

  // 气泡
  manBub.tick(dt); botBub.tick(dt); catBub.tick(dt);
  catBub.sp.position.set(cat.position.x, cat.position.y + 0.7, cat.position.z);
  headRef.getWorldPosition(tmpV); room.worldToLocal(tmpV);
  manBub.sp.position.set(tmpV.x, tmpV.y + (lying ? AV.bubble * 0.8 : AV.bubble) + Math.sin(t * 3) * 0.02, tmpV.z);
  botBub.sp.position.set(robot.position.x, 0.65, robot.position.z);

  // 屏幕 / HUD
  screenClock += dt; if (screenClock > 0.08) { screenClock = 0; drawScreen(t); }
  hudClock += dt; if (hudClock > 0.2) { hudClock = 0; drawHud(); }

  // 昼夜
  nightK += (night - nightK) * (1 - Math.exp(-dt * 2.5));
  el('bgNight').style.opacity = nightK.toFixed(3);
  sun.intensity = lerp(2.6, 0.3, nightK); sun.color.copy(dayCol).lerp(nightCol, nightK);
  hemi.intensity = lerp(0.9, 0.16, nightK);
  scene.environmentIntensity = lerp(0.9, 0.12, nightK);
  starMat.opacity = nightK;
  frameMat.emissiveIntensity = lerp(0.6, 2.4, nightK);
  lampLight.intensity += ((lampOn ? 1 : 0) * lerp(5, 9, nightK) - lampLight.intensity) * k8;
  bulbMat.emissiveIntensity = lampLight.intensity * 0.5;
  screenLight.intensity = screenMode === 2 ? 0 : lerp(0.4, 3.2, nightK);
  pendLight.intensity = pendLight2.intensity = lerp(0, 5, nightK); pendMat.emissiveIntensity = lerp(0.4, 2.2, nightK);
  holos.forEach((h, i) => { h.position.y = h.userData.y0 + Math.sin(t * 1.1 + i * 2) * 0.05; h.material.opacity = lerp(0.6, 0.95, nightK); });
  renderer.toneMappingExposure = lerp(0.82, 1.0, nightK);

  // 摇晃 + 粒子
  tickParts(dt, t);
  const sk = shakeT > 0 ? (shakeT -= dt, Math.max(0, shakeT) / 1.3) : 0;
  world.position.set(Math.sin(t * 52) * 0.14 * sk, Math.sin(t * 0.8) * 0.08 + Math.cos(t * 47) * 0.06 * sk, 0);
  world.rotation.z = Math.sin(t * 41) * 0.05 * sk; world.rotation.x = Math.cos(t * 37) * 0.03 * sk;

  controls.update();
  renderer.render(scene, camera);
  if (!simDt) requestAnimationFrame(frame);
}
let simDt = 0, simT = 0, frozen = false;   // 测试用：页面隐藏时手动快进
function sim(sec, freeze = true) { simDt = 1 / 30; for (let i = 0; i < sec * 30; i++) frame(); simDt = 0; frozen = freeze; }
const unfreeze = () => { frozen = false; };
drawScreen(0); drawHud();
frame();
window.__dbg = { request, command, st, camera, controls, man, npcs, officeReact, sim, unfreeze, save, game, boss, state: () => ({ step: !!step, left: steps.length, pending, sleeping, status: statusEl.textContent, litter: litter.length, ...st }) };
</script>
